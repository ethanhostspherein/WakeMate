name: Supabase keep-alive

# Free-tier Supabase pauses a project after 7 days with no DB activity.
# This pings a trivial read every 3 days so it never gets close.
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/trips?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase responded with HTTP $status"
          if [ "$status" -ge 300 ]; then
            echo "::error::Keep-alive ping failed"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://kygecvehnrggvfpplysn.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5Z2VjdmVobnJnZ3ZmcHBseXNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNTQ0NjQsImV4cCI6MjEwMTgzMDQ2NH0.AlXnAB6mLzubQIup-0pb8v_LjpZttKsPstXXfx_ecXA' }}
