<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WakeMate — Live trip</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body, #map { height: 100%; margin: 0; }
  #panel {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    background: #1f2430; color: #fff; padding: 14px 16px;
    font: 14px/1.4 -apple-system, Segoe UI, Roboto, sans-serif;
  }
  #panel b { font-size: 16px; }
  #status { color: #9aa4b2; margin-top: 2px; }
</style>
</head>
<body>
<div id="panel">
  <div id="dest"><b>Loading…</b></div>
  <div id="status">Connecting…</div>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ---- Configure before deploying (anon key is safe to expose — it's the
// public client key, all access is gated server-side by RLS/the RPC below).
const SUPABASE_URL = 'https://kygecvehnrggvfpplysn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5Z2VjdmVobnJnZ3ZmcHBseXNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNTQ0NjQsImV4cCI6MjEwMTgzMDQ2NH0.AlXnAB6mLzubQIup-0pb8v_LjpZttKsPstXXfx_ecXA';
const POLL_MS = 10000;

const token = new URLSearchParams(location.search).get('t');
const destEl = document.getElementById('dest');
const statusEl = document.getElementById('status');

if (!token) {
  destEl.innerHTML = '<b>Missing link</b>';
  statusEl.textContent = 'This link is missing its share token.';
} else {
  run();
}

let map, destMarker, liveMarker;

function ensureMap(lat, lng) {
  if (map) return;
  map = L.map('map').setView([lat, lng], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
  }).addTo(map);
  destMarker = L.marker([lat, lng], { title: 'Destination' }).addTo(map);
}

async function run() {
  await tick();
  setInterval(tick, POLL_MS);
}

async function tick() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_trip_share`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      },
      body: JSON.stringify({ token }),
    });
    if (!res.ok) throw new Error('request failed');
    const rows = await res.json();
    const row = rows && rows[0];
    if (!row) {
      statusEl.textContent = 'This trip is no longer being shared (expired or arrived).';
      return;
    }

    destEl.innerHTML = `<b>${row.dest_name || 'Destination'}</b>`;
    ensureMap(row.dest_lat, row.dest_lng);

    if (row.current_lat != null && row.current_lng != null) {
      const pos = [row.current_lat, row.current_lng];
      if (!liveMarker) {
        liveMarker = L.circleMarker(pos, {
          radius: 8, color: '#ff5a36', fillColor: '#ff5a36', fillOpacity: 0.9,
        }).addTo(map);
      } else {
        liveMarker.setLatLng(pos);
      }
      const bounds = L.latLngBounds([pos, [row.dest_lat, row.dest_lng]]);
      map.fitBounds(bounds, { padding: [40, 80] });
    }

    const eta = row.eta_minutes != null ? `${row.eta_minutes} min` : 'calculating…';
    const updated = row.updated_at ? new Date(row.updated_at).toLocaleTimeString() : '—';
    statusEl.textContent = `ETA ${eta} · updated ${updated}`;
  } catch (e) {
    statusEl.textContent = 'Trouble reaching the live update — retrying…';
  }
}
</script>
</body>
</html>
